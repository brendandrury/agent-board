# agent-board config. Copy to ~/.config/agent-board/config.toml and edit.
# Every setting is optional.

# Home and planning. Outcomes and Slack excerpts are local state, not repo files.
# home_title = "Your work"
# home_analysis_model = "claude:haiku"
# home_analysis_budget_usd = 1.0

# Optional Slack. Follow docs/slack-setup.md, then `agent-board slack setup`.
# These are TOP-LEVEL settings; put them before any [tables]. Never add tokens here.
# slack_source = "api"                   # "api", "mcp", or "" (off)
# slack_queries = ["to:me", "<@{user_id}>"]
# Add "from:me" to include outgoing requests you may be waiting on.
# slack_days = 7
# slack_max_messages = 40
# slack_max_threads = 12
# slack_mcp_command = ["uv", "run", "/path/to/read-only-slack-server.py"]
# slack_user_id = "U0123456789"           # MCP only; your profile's Copy member ID
# slack_user_name = "Your Name"          # optional; disambiguates display names in thread text

# Sessions are read from ~/.claude and ~/.codex, or $CLAUDE_CONFIG_DIR and
# $CODEX_HOME if set, and resumed with `claude --resume <id>` / `codex resume <id>`.

# The tool that files sessions, and the --model to pass it. For claude the
# default model is sonnet; set "" to use the tool's own default.
# classifier = "claude"            # or "codex"
# classifier_model = "sonnet"
# effort = "low"                   # low, medium or high

# How the headless Claude classifier is isolated from your hooks, CLAUDE.md,
# plugins and MCP servers. "bare" is the tightest but only works with an API key
# or Bedrock/Vertex/Foundry credentials; "restricted" works with a claude.ai
# login but refuses settings that default to bypassPermissions; "none"
# relies on --tools "" and --strict-mcp-config alone. "auto" tries them in that
# order and settles on the first that runs.
# claude_isolation = "auto"

# Phones, emails, SSNs and Salesforce IDs are scrubbed from what the classifier
# sees unless its model id is listed here. Secrets are always scrubbed.
# pii_cleared_models = []

# days = 14                        # only file sessions active in the last N days
# budget = 100000                  # max transcript characters sent per session
# workers = 4                      # parallel classifier calls
# port = 8765

# Links and display.
# issue_url = "https://yourco.atlassian.net/browse/{key}"   # issue keys like ABC-123 become links
# github_repo = "you/repo"         # for PR numbers when the session's cwd has no GitHub remote
# projects_dir = "~/code"          # paths under here are shown relative to it

# Where Resume opens a session: "auto" or "Terminal" (Terminal.app), "iTerm", or
# an argv template, e.g. ["kitty", "zsh", "-ic", "{cmd}; exec zsh"]. On macOS,
# resuming a session that's already open brings its Terminal or iTerm tab forward.
# terminal = "auto"
# new_tab = true                   # open in a new tab of the front window, not a new window.
#                                  # In Terminal.app this sends Cmd-T, which needs the app
#                                  # running agent-board allowed under Accessibility.

# A sentence or two about you and your work, so the classifier's titles and
# workstreams use your vocabulary.
# about = "Backend engineer on the payments team; most work is in the billing-api repo."

# PR reviews (agent-board review). The repo defaults to github_repo.
# review_repo = "you/repo"
# review_clone = "~/code/repo"             # local clone; each PR head is checked out from it
# review_authors = ["teammate1", "teammate2"]
# review_launcher = "claude:opus"          # launcher[:model]; writes the rubric, confirms, drafts
# review_small = ["claude:haiku"]          # Low's stage-1 sweep; "codex:gpt-6-luna" works too
# review_filter = "claude:sonnet"          # Low's stage-2 triage; "" to let the small models filter
# review_rubric_sources = ["~/notes/repo-gotchas.md"]   # extra notes the rubric is written from
# review_rubric_branches = ["release"]   # long-lived branches whose docs the rubric also reads
# review_withhold_models = []              # model ids that get only the diff and the code
# review_workers = 8                       # parallel small-model calls
# review_max_units = 120                   # sweep units (files, or slices of big ones) per run
# review_effort = "medium"
# review_budget_usd = 15                   # cap per stage call
# review_guidance = "Also read docs/conventions.md."
# review_disclosure = "Review generated by AI. ..."   # first line of every posted review, in italics;
#                                         # {reviews} is "review", or "reviews" after more than one feedback round

# The tickets page (agent-board tickets). Jira is read through the Atlassian MCP
# by default; set jira_email and JIRA_API_TOKEN (environment) for the REST API.
# tickets_jql = "project = ABC AND assignee = currentUser() AND statusCategory != Done"
# tickets_me = "Your Name"                # your Jira display name, for "Assigned to me"
# jira_site = "https://yourco.atlassian.net"   # issue_url's host when empty
# tickets_fetcher = "claude:haiku"        # launcher[:model] whose Atlassian MCP runs the search
# tickets_mcp_tool = "mcp__Atlassian-MCP-Server__searchJiraIssuesUsingJql"
# tickets_max = 150
# tickets_ttl = 900                       # seconds before a page load refreshes in the background
# tickets_clone = "~/code/repo"           # where spawned worktrees come from; review_clone when empty
# tickets_worktrees = "~/code/worktrees"  # <clone>/.claude/worktrees when empty
# tickets_launcher = "claude"             # the Spawn picker's default
# tickets_launchers = ["claude", "claude:sonnet", "codex"]   # the picker's choices, launcher[:model];
#                                         # every launcher (one per profile and model) when unset
# tickets_seed = "Work on {key}: {summary} ({url}) in {worktree}, branch {branch} from {base}."

# Ticket intelligence. Evaluation and scans are explicit, tool-less Claude calls.
# Creation opens a Claude/Codex terminal session, which checks live duplicates and
# asks you to approve the exact tickets before posting anything.
# tickets_triage_model = "claude:haiku"    # high / low / zero confidence of scope fit
# tickets_scan_model = "claude:haiku"      # editable in the memory-scan form
# tickets_creator_model = "claude:opus"    # editable; e.g. "codex:gpt-6-sol"
# tickets_creator_guidance = "Use project ABC, Task issue type. Ask me which parent to use."
# tickets_analysis_budget_usd = 3          # total budget per evaluation or scan; max $1 per call
# tickets_memory_paths = [                # files or folders; narrow globs allowed
#   "~/.claude/projects/*/memory", "~/.claude/memory", "~/.codex/memories",
#   "~/.config/opencode/AGENTS.md", "~/.config/opencode/memory"
# ]                                      # missing optional locations are reported, not created
# OpenCode's AGENTS.md is its documented persistent guidance; memory/ is an
# optional user-managed convention. Add plugin/project-specific locations here.

# [review_reviewers]                     # stage-3 reviewers by effort; review_launcher alone if unset
# medium = ["claude:opus", "codex:gpt-6-sol"]
# high = ["claude:opus", "codex:gpt-6-sol", "claude:fable"]

# Messages. Human-started discussion pairs stay off until this allowlist of
# launcher[:model] entries is set; Claude only, and an explicit model is required.
# message_pair_models = ["claude:sonnet", "claude:opus"]
# Model names (substring match) whose mailbox participants and pair peers must
# use the pii-free lane; joining the normal lane with one is rejected.
# pii_free_only_models = ["fable"]

# Saved views go in their own tables AFTER top-level settings. Descriptions are
# scope criteria, not a JQL: each view classifies the already-loaded ticket list.
# Keep private scope names, company context and memory paths in your own config.
# [tickets_views."Search rewrite"]
# description = "Moving search to the new index: the indexer, query API, ranking parity tests and the cutover. Not unrelated UI work."
# sources = ["~/notes/search-rewrite.md"]

# Preferred workstream names and what belongs in each. The classifier reuses
# these when a session fits and coins new names for work that fits none.
# [workstreams]
# "Billing Migration" = "moving invoices off the legacy system"
# "Agent Tooling" = "launchers, MCP servers, agent-board itself"
